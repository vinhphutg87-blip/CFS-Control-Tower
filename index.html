<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CFS Risk Control Tower · GLogistics 2026 prototype</title>
<meta name="description" content="Interactive prototype: risk-based release control for LCL export at a CFS. Case data from GLogistics 2026 Round 2.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Big+Shoulders+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --rust:#74250A; --ember:#CC2D05; --orange:#ED640F; --amber:#F9C044; --paper:#F9F4ED;
  --rust-deep:#551A06; --rust-mid:#A5350B;
  --ink:#2B1408; --ink-2:#6A4B3B; --ink-3:#967868;
  --card:#FFFDF9; --rule:#E9DDCC; --rule-2:#D8C6AF; --wash:#F3EADD;
  --amber-bg:#FDF0CB; --orange-bg:#FCE5D2; --ember-bg:#FADFD6;
  --ok:#1F7A55; --ok-bg:#E1F0E7; --info:#2A6A8C; --info-bg:#E0ECF2; --grey:#857A70; --grey-bg:#EEE7DE;
  --display:"Big Shoulders Display","Barlow Condensed","Roboto Condensed","Arial Narrow","DejaVu Sans Condensed",sans-serif;
  --body:"Be Vietnam Pro","Inter","Segoe UI",system-ui,-apple-system,sans-serif;
  --side:236px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--body);font-size:14px;line-height:1.5;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--rust-mid);text-underline-offset:3px}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px;border-radius:4px}
h1,h2,h3,h4,p{margin:0}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
.side{background:var(--rust);color:#F9E9DA;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:18px 18px 14px;display:flex;gap:11px;align-items:center;border-bottom:1px solid rgba(249,244,237,.16)}
.brand-mark{width:38px;height:38px;flex:none}
.brand-name{font-family:var(--display);font-weight:800;font-size:21px;line-height:1;letter-spacing:.01em;color:#fff}
.brand-sub{font-size:11.5px;color:#F3CDB4;margin-top:4px}
.nav{padding:10px 10px 16px;flex:1}
.nav-group{font-size:11.5px;color:#EDBFA2;padding:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;color:#F9E9DA;text-decoration:none;font-size:13.5px;font-weight:500;position:relative}
.nav a:hover{background:rgba(249,244,237,.09)}
.nav a.on{background:var(--rust-deep);color:#fff}
.nav a.on::before{content:"";position:absolute;left:-10px;top:6px;bottom:6px;width:4px;background:var(--amber);border-radius:0 3px 3px 0}
.nav a .count{margin-left:auto;font-size:11.5px;background:var(--amber);color:var(--ink);border-radius:9px;padding:0 7px;font-weight:600;font-variant-numeric:tabular-nums}
.side-foot{padding:12px 18px 16px;font-size:11.5px;color:#EDBFA2;border-top:1px solid rgba(249,244,237,.16)}
.side-foot b{color:#fff;font-weight:600}

.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:16px;padding:10px 28px;background:var(--card);border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:30;flex-wrap:wrap}
.voy{display:flex;align-items:baseline;gap:10px;min-width:0}
.voy-name{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:.02em;color:var(--rust);white-space:nowrap}
.voy-meta{font-size:12.5px;color:var(--ink-2)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.role{display:flex;align-items:center;gap:8px;border:1px solid var(--rule-2);border-radius:8px;padding:4px 6px 4px 10px;background:#fff}
.role label{font-size:11.5px;color:var(--ink-2);white-space:nowrap}
.role select{border:0;background:var(--amber-bg);border-radius:6px;padding:5px 8px;font-weight:600;font-size:13px}

/* cut-off rail: the signature element */
.rail{background:var(--ink);color:#F9E9DA;padding:0 28px 12px;position:sticky;top:57px;z-index:25}
.rail::before{content:"";display:block;height:6px;margin:0 -28px 10px;background:repeating-linear-gradient(-45deg,var(--amber) 0 12px,var(--ink) 12px 24px)}
.rail-in{display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:center}
.clock{display:flex;flex-direction:column;gap:1px;min-width:150px}
.clock-l{font-size:11.5px;color:#E4B99B}
.clock-t{font-family:var(--display);font-weight:800;font-size:28px;line-height:1;color:var(--amber);letter-spacing:.02em;white-space:nowrap}
.track{position:relative;height:54px}
.track-line{position:absolute;left:0;right:0;top:15px;height:4px;background:rgba(249,244,237,.2);border-radius:2px}
.track-fill{position:absolute;left:0;top:15px;height:4px;background:var(--orange);border-radius:2px;transition:width .35s ease}
.stop{position:absolute;top:0;transform:translateX(-50%);background:none;border:0;padding:0;color:#E9D2C0;display:flex;flex-direction:column;align-items:center;gap:5px;width:112px}
.stop i{width:14px;height:14px;border-radius:50%;background:var(--ink);border:3px solid rgba(249,244,237,.45);margin-top:8px;transition:all .2s}
.stop.past i{border-color:var(--orange);background:var(--orange)}
.stop.now i{width:22px;height:22px;margin-top:4px;border-color:var(--amber);background:var(--ember)}
.stop span{font-size:11px;line-height:1.25;text-align:center}
.stop b{display:block;font-weight:600;color:#fff;font-variant-numeric:tabular-nums}
.stop.now b{color:var(--amber)}
.stop:hover i{border-color:var(--amber)}
.rail-btns{display:flex;gap:6px}
.rail-btns button{background:transparent;border:1px solid rgba(249,244,237,.4);color:#fff;border-radius:7px;padding:7px 11px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.rail-btns button.go{background:var(--orange);border-color:var(--orange)}
.rail-btns button:disabled{opacity:.35;cursor:not-allowed}
.rail-btns button:not(:disabled):hover{border-color:var(--amber)}

.page{padding:24px 28px 56px;max-width:1500px;width:100%}
.ph{display:flex;align-items:flex-end;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.ph h1{font-family:var(--display);font-weight:800;font-size:34px;line-height:1.05;letter-spacing:.005em;color:var(--rust)}
.ph p{color:var(--ink-2);max-width:72ch;margin-top:4px}
.ph .sp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.crumb{font-size:12.5px;color:var(--ink-2);margin-bottom:6px}
.crumb a{color:var(--ink-2)}

/* ---------- building blocks ---------- */
.card{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:18px 20px}
.card.flat{background:transparent;border-style:dashed}
.card h2,.sec-h{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:.01em;color:var(--ink);line-height:1.15}
.card h3{font-size:14px;font-weight:600}
.card-h{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-h .r{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sub{color:var(--ink-2);font-size:13px}
.note{font-size:12.5px;color:var(--ink-2);margin-top:10px;max-width:78ch}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.g-a{grid-template-columns:1.25fr 1fr}.g-b{grid-template-columns:1fr 1.5fr 1fr}.g-c{grid-template-columns:1.6fr 1fr}
.stack>*+*{margin-top:18px}
.grid>*,.stack>*,.rail-in>*,.hh-wrap>*{min-width:0}
.g4{grid-template-columns:repeat(4,1fr)}.g-roi{grid-template-columns:340px 1fr;align-items:start}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;gap:7px;border-radius:8px;padding:8px 14px;font-weight:600;font-size:13.5px;border:1px solid var(--rule-2);background:#fff;color:var(--ink);text-decoration:none;line-height:1.2}
.btn:hover{border-color:var(--rust-mid)}
.btn.pri{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.pri:hover{background:#D9570A;border-color:#D9570A}
.btn.dark{background:var(--rust);border-color:var(--rust);color:#fff}
.btn.danger{border-color:var(--ember);color:var(--ember)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:6px}
.btn:disabled,.btn.off{opacity:.45;cursor:not-allowed;background:var(--wash);border-color:var(--rule-2);color:var(--ink-2)}
.why{font-size:12.5px;color:var(--ink-2);display:flex;gap:6px;align-items:flex-start;margin-top:8px}
.why svg{margin-top:2px;color:var(--ember)}

.chip{display:inline-flex;align-items:center;gap:5px;border-radius:5px;padding:2px 8px;font-size:12px;font-weight:600;line-height:1.5;white-space:nowrap;border:1px solid transparent}
.chip svg{width:13px;height:13px}
.c-ok{background:var(--ok-bg);color:#165C40;border-color:#BFDDCB}
.c-amber{background:var(--amber-bg);color:#6B4A00;border-color:#EFD587}
.c-red{background:var(--ember-bg);color:#96210A;border-color:#EDB6A6}
.c-grey{background:var(--grey-bg);color:#5B5148;border-color:#DBD0C3}
.c-blue{background:var(--info-bg);color:#1E516D;border-color:#BCD5E2}
.c-orange{background:var(--orange-bg);color:#8E3A06;border-color:#F2C29D}
.c-line{background:#fff;color:var(--ink-2);border-color:var(--rule-2);font-weight:500}
.src{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--ink-2);border:1px dashed var(--rule-2);border-radius:4px;padding:0 6px;line-height:1.6;white-space:nowrap;background:transparent;font-weight:500}
.src::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ink-3)}
.src.s-derived::before{border-radius:1px;background:var(--orange)}
.src.s-assume::before{border-radius:0;background:var(--amber);transform:rotate(45deg)}
.src.s-sim::before{background:transparent;border:1.5px solid var(--ember)}

table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-weight:600;color:var(--ink-2);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--rule-2);white-space:nowrap;vertical-align:bottom}
table.t td{padding:10px;border-bottom:1px solid var(--rule);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--wash)}
table.t tfoot td{font-weight:700;border-top:2px solid var(--rule-2);border-bottom:0}
.tw{overflow-x:auto}
.bk{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:.02em;color:var(--rust);line-height:1}
.ref{font-size:11.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;letter-spacing:.02em}

.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13px}
.kv dt{color:var(--ink-2)}.kv dd{margin:0;font-weight:500;text-align:right;font-variant-numeric:tabular-nums}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--rule-2);margin-bottom:18px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 14px;font-weight:600;font-size:13.5px;color:var(--ink-2);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--rust);border-bottom-color:var(--orange)}
.seg{display:inline-flex;border:1px solid var(--rule-2);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.seg button.on{background:var(--rust);color:#fff}
input[type=text],input[type=number],select,textarea{border:1px solid var(--rule-2);border-radius:7px;padding:7px 10px;background:#fff;width:100%}
input[type=range]{accent-color:var(--orange);width:100%}
label.f{display:block;font-size:12.5px;color:var(--ink-2);font-weight:500}
label.f>span{display:block;margin-bottom:4px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}

/* manifest strip (headline figures) */
.strip{display:grid;grid-template-columns:repeat(6,1fr);background:var(--card);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.strip>div{padding:14px 16px;border-right:1px solid var(--rule)}
.strip>div:last-child{border-right:0}
.strip b{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;color:var(--rust);display:block;font-variant-numeric:tabular-nums}
.strip span{font-size:12.5px;color:var(--ink-2);display:block;margin-top:5px;line-height:1.35}
.strip .hot b{color:var(--ember)}

/* andon board */
.andon{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.tile{position:relative;text-align:left;background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:12px 12px 12px 20px;display:flex;flex-direction:column;gap:6px;min-height:150px;overflow:hidden}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--grey)}
.tile:hover{border-color:var(--rust-mid)}
.tile.st-ok::before{background:var(--ok)}.tile.st-amber::before{background:var(--amber)}
.tile.st-red::before{background:repeating-linear-gradient(-45deg,var(--ember) 0 6px,var(--rust) 6px 12px)}
.tile.st-blue::before{background:var(--info)}
.tile.st-grey{background:#F6F0E7}
.tile-top{display:flex;align-items:center;gap:8px}
.tile-top .bk{font-size:26px}
.tile-top .chip{margin-left:auto}
.tile-name{font-weight:600;font-size:13.5px;line-height:1.3}
.tile dl{margin:0;font-size:12px;display:grid;grid-template-columns:54px 1fr;gap:2px 6px;color:var(--ink-2)}
.tile dd{margin:0;color:var(--ink);font-weight:500}
.tile-act{margin-top:auto;font-size:12px;color:var(--rust-mid);font-weight:600;border-top:1px dashed var(--rule-2);padding-top:6px}

.cd{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cd>div{border:1px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--card)}
.cd b{font-family:var(--display);font-weight:800;font-size:26px;display:block;line-height:1.1}
.cd .over b{color:var(--ember)}.cd .left b{color:var(--ok)}
.bar{height:8px;border-radius:4px;background:var(--wash);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--orange);border-radius:4px}
.bar.over i{background:var(--ember)}

.meter{display:flex;flex-direction:column;gap:10px}
.meter-row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13px;align-items:center}
.meter-row .bar{grid-column:1/-1;margin:0}
.meter-row b{font-variant-numeric:tabular-nums}

/* risk matrix */
.mx{display:grid;grid-template-columns:28px repeat(5,1fr);grid-template-rows:repeat(5,minmax(58px,1fr)) 26px;gap:3px;position:relative}
.mx .ax{font-size:11.5px;color:var(--ink-2);display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.mx .cell{border-radius:5px;padding:4px;display:flex;flex-wrap:wrap;gap:3px;align-content:flex-start;position:relative}
.mx .cell .sc{position:absolute;right:5px;bottom:2px;font-size:10.5px;color:rgba(43,20,8,.45);font-variant-numeric:tabular-nums}
.t-less{background:#FCEBB9}.t-mod{background:#F6B278}.t-ser{background:#E4664A}
.rk{border:0;border-radius:4px;background:var(--card);color:var(--ink);font-weight:700;font-size:11.5px;padding:2px 5px;line-height:1.3;font-variant-numeric:tabular-nums;box-shadow:0 0 0 1px rgba(43,20,8,.25)}
.rk.hs{box-shadow:0 0 0 2px var(--ink)}
.rk.on{background:var(--ink);color:#fff}
.mx-ylab,.mx-xlab{font-size:12px;color:var(--ink-2);font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:10px;align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* stepper */
.steps{display:flex;gap:0;margin:4px 0 20px;overflow-x:auto}
.step{flex:1;min-width:120px;position:relative;padding:0 8px 0 0}
.step .dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--rule-2);background:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--ink-2);position:relative;z-index:1}
.step::after{content:"";position:absolute;left:26px;right:0;top:12px;height:2px;background:var(--rule-2)}
.step:last-child::after{display:none}
.step.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.step.done::after{background:var(--ok)}
.step.cur .dot{background:var(--orange);border-color:var(--orange);color:#fff}
.step b{display:block;font-size:13px;margin-top:6px}
.step span{font-size:11.5px;color:var(--ink-2)}

.check{list-style:none;margin:0;padding:0}
.check li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--rule);font-size:13px}
.check li:last-child{border-bottom:0}
.check .bx{width:20px;height:20px;border-radius:5px;border:1.5px solid var(--rule-2);flex:none;display:grid;place-items:center;background:#fff;color:#fff;margin-top:1px}
.check li.y .bx{background:var(--ok);border-color:var(--ok)}
.check li.n .bx{border-style:dashed}
.check .g{flex:1}
.check small{display:block;color:var(--ink-2);font-size:12px}

.alert{border-radius:8px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-size:13px;border:1px solid}
.alert svg{margin-top:2px;width:18px;height:18px}
.alert b{display:block;font-size:13.5px}
.a-red{background:var(--ember-bg);border-color:#EDB6A6;color:#7D1C08}
.a-amber{background:var(--amber-bg);border-color:#EFD587;color:#5C4000}
.a-ok{background:var(--ok-bg);border-color:#BFDDCB;color:#165C40}
.a-info{background:var(--info-bg);border-color:#BCD5E2;color:#1E516D}
.a-plain{background:var(--wash);border-color:var(--rule-2);color:var(--ink)}

.metric{border:1px solid var(--rule);border-radius:8px;padding:12px 14px;background:#fff}
.metric b{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.05;display:block;font-variant-numeric:tabular-nums}
.metric span{font-size:12.5px;color:var(--ink-2)}
.metric.bad b{color:var(--ember)}.metric.good b{color:var(--ok)}
.formula{font-size:12.5px;background:var(--wash);border-radius:6px;padding:8px 12px;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.7}

/* timeline / audit */
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--rule-2)}
.tl li{position:relative;padding:0 0 14px 26px;font-size:13px}
.tl li::before{content:"";position:absolute;left:2px;top:5px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--rust-mid)}
.tl li.sim::before{border-color:var(--ember);border-style:dashed}
.tl time{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums;display:block}

/* overlays */
.ov{position:fixed;inset:0;background:rgba(43,20,8,.5);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--card);border-radius:12px;max-width:520px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(43,20,8,.35)}
.modal h2{font-family:var(--display);font-weight:800;font-size:25px;color:var(--rust);margin-bottom:8px}
.modal p{color:var(--ink-2);font-size:13.5px}
.modal .row{justify-content:flex-end;margin-top:20px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--card);z-index:81;box-shadow:-12px 0 40px rgba(43,20,8,.25);padding:22px 24px;overflow-y:auto;animation:slide .22s ease}
@keyframes slide{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.x{margin-left:auto;border:0;background:var(--wash);border-radius:6px;width:30px;height:30px;display:grid;place-items:center}
.toasts{position:fixed;bottom:18px;right:18px;z-index:90;display:flex;flex-direction:column;gap:8px;max-width:400px}
.toast{background:var(--ink);color:#fff;border-radius:8px;padding:11px 14px;font-size:13px;display:flex;gap:9px;align-items:flex-start;border-left:5px solid var(--amber);animation:slide .2s ease}
.toast.bad{border-left-color:var(--ember)}.toast.good{border-left-color:#4DBA8A}
.toast b{display:block}

/* handheld */
.hh-wrap{display:grid;grid-template-columns:380px 1fr;gap:28px;align-items:start}
.hh{background:var(--ink);border-radius:26px;padding:14px;color:#fff}
.hh-screen{background:var(--paper);color:var(--ink);border-radius:14px;overflow:hidden;min-height:600px;display:flex;flex-direction:column}
.hh-head{background:var(--rust);color:#fff;padding:12px 14px;font-size:12.5px}
.hh-head b{font-family:var(--display);font-size:20px;font-weight:800;display:block;letter-spacing:.02em}
.hh-body{padding:14px;display:flex;flex-direction:column;gap:12px;flex:1}
.hh-res{border-radius:10px;padding:14px;border:2px solid;font-size:13px}
.hh-res h3{font-family:var(--display);font-weight:800;font-size:24px;line-height:1.05;margin-bottom:6px}
.hh-res.good{background:var(--ok-bg);border-color:var(--ok);color:#124A34}
.hh-res.bad{background:var(--ember-bg);border-color:var(--ember);color:#7D1C08;animation:shake .3s}
.hh-res.warn{background:var(--amber-bg);border-color:#D9A514;color:#5C4000}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.labels{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.lab{border:1.5px solid var(--ink);border-radius:4px;background:#fff;padding:7px 9px;text-align:left;font-size:11.5px;line-height:1.35;position:relative}
.lab b{font-family:var(--display);font-size:17px;font-weight:800;display:block;letter-spacing:.03em}
.lab .bc{height:16px;margin-top:5px;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 3px,var(--ink) 3px 4px,transparent 4px 7px,var(--ink) 7px 10px,transparent 10px 12px)}
.lab.used{opacity:.4}
.lab:hover{background:var(--amber-bg)}

/* diagrams */
.dg{overflow-x:auto;border:1px solid var(--rule);border-radius:10px;background:var(--card)}
.dg svg{display:block}
.dg text{font-family:var(--body)}
.chart text{font-family:var(--body);font-size:11px;fill:var(--ink-2)}
.tip{position:fixed;z-index:95;background:var(--ink);color:#fff;font-size:12px;padding:7px 10px;border-radius:6px;pointer-events:none;max-width:260px;line-height:1.45}
.tip b{display:block}

.scene{border:1px solid var(--rule);border-radius:8px;padding:12px 14px;margin-top:10px;background:#fff}
.scene b{display:block;font-size:13.5px}
.scene p{font-size:12.5px;color:var(--ink-2);margin:2px 0 8px}
.scene .n{font-family:var(--display);font-weight:800;font-size:22px;color:var(--orange);float:right;line-height:1}

@media (max-width:1180px){
  .g-b,.g3,.g4{grid-template-columns:1fr 1fr}.andon{grid-template-columns:repeat(3,1fr)}
  .strip{grid-template-columns:repeat(3,1fr)}.strip>div:nth-child(3){border-right:0}.strip>div:nth-child(-n+3){border-bottom:1px solid var(--rule)}
  .hh-wrap{grid-template-columns:1fr}
}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto}
  .nav{display:flex;overflow-x:auto;gap:4px;padding:8px}.nav-group{display:none}.nav a{white-space:nowrap}.nav a.on::before{display:none}
  .side-foot{display:none}
  .top,.rail{position:static}
  .rail-in{grid-template-columns:1fr}.track{min-width:640px}.rail-in>div:nth-child(2){overflow-x:auto}
  .g2,.g-a,.g-b,.g-c,.g3,.g4,.g-roi,.cd{grid-template-columns:1fr}.andon{grid-template-columns:repeat(2,1fr)}
  .card{overflow-x:auto;padding:16px 14px}
  .page{padding:18px 14px 40px}.top{padding:10px 14px}.rail{padding:0 14px 12px}.rail::before{margin:0 -14px 10px}
}
@media (max-width:560px){.andon,.strip{grid-template-columns:1fr}.strip>div{border-right:0;border-bottom:1px solid var(--rule)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{.side,.rail,.top-right{display:none}.app{display:block}}

/* ---- ROI model: every output recalculates from assumptions (report Table 15) ---- */
function roiCalc(m, voy = m.voy, adj = 1) {
  const per = m.ben.map(b => b[2] * b[3] / 100 * b[4] / 100 * adj), tot = per.reduce((a, b) => a + b, 0), r = m.disc / 100;
  const items = m.phases.flatMap(p => p[5]), capex = items.reduce((a, c) => a + c[1], 0), hw = items.filter(c => c[2]).reduce((a, c) => a + c[1], 0);
  const opex = m.wms * 12 + m.ai * 12 + hw * m.maint / 100, ben = tot * voy, net = ben - opex;
  let af = 0; for (let y = 1; y <= m.years; y++) af += 1 / Math.pow(1 + r, y);
  const cf = [-capex]; for (let y = 1; y <= m.years; y++) cf.push(net);
  let c = 0; const cum = cf.map(v => (c += v));
  return { per, tot, capex, opex, ben, net, cf, cum, af, npv: net * af - capex, bcr: ben * af / (capex + opex * af), roi3: (3 * net - capex) / capex, pay: net > 0 ? capex / net : null,
    beOpex: opex / tot, be3: (capex / 3 + opex) / tot, beNpv: (capex / af + opex) / tot };
}

        <p class="note">Likelihood is the chance of the consequence under today's controls; impact is the highest of legal, safety, schedule and financial scores. R02 keeps a residual of 5: early arrival cannot be undone for this voyage, only prevented by a delivery window.</p></div></div></div>`;

      ${g.map((x, i) => { const rs = R.filter(r => r.gate === x), X = 40 + i * 268, f = i === 0; return `<rect x="${X}" y="40" width="236" height="120" rx="8" fill="${f ? '#FCE5D2' : '#FFFDF9'}" stroke="${f ? '#ED640F' : '#2B1408'}" stroke-width="${f ? 2 : 1}"/><text x="${X + 16}" y="80" font-size="34" font-weight="800" fill="#74250A" style="font-family:var(--display)">${x}</text><text x="${X + 72}" y="66" font-size="13" font-weight="600" fill="#2B1408">${nm[i]}</text><text x="${X + 72}" y="84" font-size="12" fill="#6A4B3B">${rs.length} risk type${rs.length > 1 ? 's' : ''} first detectable</text>
        <text x="${X + 16}" y="114" font-size="11.500" fill="#2B1408">${rs.slice(0, 5).map(r => r.id).join(', ')}</text><text x="${X + 16}" y="132" font-size="11.500" fill="#2B1408">${rs.slice(5).map(r => r.id).join(', ')}</text><text x="${X + 16}" y="150" font-size="11" fill="#967868">${['RC1 screening, RC2 data', 'RC3 coordination', 'RC4 exception closure', 'Operational hazards'][i]}</text>`; }).join('')}

      ${[['RC1, E1', 'R03 R04 R05 R06 R07 R11 R13', 'Hold, reject, verify documents', 'Cargo acceptance checklist', 'Rule engine at the booking portal', 'K03, K04, K05'], ['RC2, E1', 'R10 R12', 'Re-measure, reconcile chargeable basis', 'Data dictionary', 'CBM against dimensions check', 'Reconciliation result'], ['RC3, E2', 'R01 R02', 'Rollover, conditional late acceptance', 'Delivery window, appointments', 'Automatic cut-off alerts', 'K01'], ['RC4, E3', 'R09', 'Re-tally, reconcile', 'Exception log, right to stop receiving', 'Exception workflow, cargo status', 'K02, K06, K08'], ['Hazard, E4', 'R08 R14', 'Technical hold, separate staging', 'Technical approval, staging segregation', 'Load planning, scan-to-load', 'K07']].map(r => `<tr><td><b>${r[0]}</b></td><td>${esc(RC[r[0].split(',')[0]][0])}</td><td>${r[1].split(' ').join(', ')}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td><td>${r[5]}</td></tr>`).join('')}</tbody></table></div>

      <p class="note">K05 to K07 are release controls as well as scores: release is blocked by each booking's hold status, never by an aggregate KPI. The black tick marks the target. Baselines come from 12 bookings on one voyage and are indicative only.</p></div>`;
  else body = `<div class="stack"><div class="card"><div class="card-h"><h2>Where is the constraint?</h2>${chip('grey', 'Baseline not available', 'clock')}</div><p class="sub" style="max-width:76ch">Under the Theory of Constraints, adding capacity to a stage that is not the bottleneck does not raise throughput. Twelve booking records cannot show which stage limits this CFS, so nothing here is labelled a bottleneck.</p>

    <div class="grid g3" style="margin-top:10px;gap:10px">${FIN.alloc.map((a, i) => `<div><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${col[i]};margin-right:6px"></span><b>${a[0]}</b> <span class="num">${usd(a[1])}</span> <span class="sub">(${(a[1] / tot * 100).toFixed(1)}%)</span><div class="sub">${a[2].split(' ').join(', ')}</div></div>`).join('')}</div>
    <p class="note">Rollover value is revenue delayed by one sailing, lost only if the customer cancels. The out-of-scope value is not lost revenue: those bookings should not have been accepted on this service.</p></div>
  <div class="grid g2">
    <div class="card"><div class="card-h"><h2>Determinable charges</h2><span class="sub">Tariff Table 2 and training norms</span></div><table class="t"><thead><tr><th>Booking</th><th>Charge</th><th>Risk</th><th class="n">USD</th></tr></thead><tbody>${FIN.fixed.map(x => `<tr><td><b>${x[0]}</b></td><td>${x[1]}<div class="sub num">${x[3]}</div></td><td>${x[2]}</td><td class="n">${x[4].toFixed(2)}</td></tr>`).join('')}</tbody><tfoot><tr><td colspan="3">Payable by shippers</td><td class="n">${fx.toFixed(2)}</td></tr></tfoot></table>
      <p class="note">88% sits on two bookings: B06 and B11 special-cargo surcharges, $392.88. If overweight and dead space cannot be charged together on B06 the total falls to $308.66 or $327.50.</p></div>

  </div>
  <div class="grid g-c">
    <div class="card"><div class="card-h"><h2>Net financial impact</h2></div><div class="formula">Net financial impact = Incremental costs incurred − Costs recovered from the shipper + Net claims and losses</div>

  const L = [['Rule engine', 'Hard controls: mandatory fields, prohibited list, door fit, CBM tolerance, cut-off, approved load list', 'Blocks', 1], ['AI-assisted detection', 'Suggestions only: HS code against description, hints of batteries, exception priority by time to cut-off', 'Suggests', 0], ['Human authorisation', 'Compliance, CFS Technical, Documentation, CFS Supervisor, then the Operations Executive', 'Decides', 0], ['Audit trail', 'Versioned load list; approver, evidence and time for every release decision', 'Records', 0]];
  return `<div class="dg"><svg viewBox="0 0 1000 356" width="1000" height="356" style="min-width:1000px" role="img" aria-labelledby="arch-title arch-desc"><title id="arch-title">Four layers of the digital control architecture</title><desc id="arch-desc">A layer stack: the rule engine enforces hard constraints, AI only suggests exceptions to check, authorised people decide, and the audit trail records every release decision.</desc>
    ${L.map((l, i) => { const y = 24 + i * 68, f = l[3]; return `<rect x="96" y="${y}" width="880" height="68" fill="${f ? '#FCE5D2' : i % 2 ? '#F9F4ED' : '#FFFDF9'}" stroke="${f ? '#ED640F' : '#D8C6AF'}" stroke-width="${f ? 2 : 1}"/><text x="116" y="${y + 30}" font-size="15" font-weight="700" fill="#2B1408">${l[0]}</text><text x="116" y="${y + 50}" font-size="11.500" fill="#6A4B3B">${l[1]}</text><text x="956" y="${y + 39}" text-anchor="end" font-size="20" font-weight="800" fill="${f ? '#CC2D05' : '#74250A'}" style="font-family:var(--display)">${l[2]}</text>`; }).join('')}
    <text x="24" y="40" font-size="11" fill="#6A4B3B">Booking</text><text x="24" y="54" font-size="11" fill="#6A4B3B">data in</text><line x1="48" y1="64" x2="48" y2="284" stroke="#967868" stroke-width="1.500" marker-end="url(#aa)"/><defs><marker id="aa" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#967868"/></marker></defs><text x="24" y="304" font-size="11" fill="#6A4B3B">Release</text>
    <line x1="24" y1="318" x2="976" y2="318" stroke="#E9DDCC"/><rect x="24" y="330" width="22" height="14" fill="#FCE5D2" stroke="#ED640F" stroke-width="2"/><text x="54" y="342" font-size="11" fill="#6A4B3B">The only layer that can stop a booking on its own. AI never approves, classifies DG, or overrides a hard constraint.</text></svg></div>`;
}
VIEWS.blueprint = () => {
  const tab = curTab('bp', 'svc');
  const gates = [['E1 Booking acceptance', 'Booking portal', 'Confirmation locked when a mandatory field is missing, the description is on the prohibited or cold list, a unit exceeds the door, or CBM deviates beyond tolerance; surcharge pre-advice calculated', 'HS code against description; description hints at batteries', 'R03 R04 R05 R07 R10 R11 R12'], ['E2 Pre-arrival', 'Dock appointment', 'Delivery inside the window; cut-off reminders at T−48 h and T−24 h', 'Late-risk forecast from shipper history', 'R01 R02'], ['E3 Receiving', 'WMS receiving, handheld', 'Every arrival recorded with a status; barcode per unit by booking and destination; automatic exception on a quantity mismatch; no move to Released while a hold is open', 'Exception priority by time left to cut-off', 'R09 R13 R14'], ['E4 Storage and stuffing', 'WMS location, load planning, scan-to-load', 'Staging by lot; only units on the approved load list can be loaded; GW, CBM and non-stackable checks', 'Not used', 'R06 R08 R14'], ['Optional', 'Dimensioning and weighing station', 'Records dimensions, weight and a photo for units inside the device range', 'Not used', 'R10']];
  const phases = ROI0.phases.map(p => [p[0], p[1], p[2], p[3], p[4], p[5].length ? usd(p[5].reduce((a, c) => a + c[1], 0), 0) : 'No system CAPEX', p[6]]);
  let body;
  if (tab === 'svc') body = `<div class="stack">${svcBlueprint()}<p class="note" style="margin-top:0">A training and governance view, not a decision engine. Read each column top to bottom: the customer sees a short question about volume; below the line a data hold, a technical review and an approval chain are running.</p></div>`;
  else if (tab === 'life') body = `<div class="stack">${lifecycle()}<div class="grid g2"><div class="card"><div class="card-h"><h2>Four status dimensions, kept apart</h2></div><table class="t"><tbody>${[['Booking', 'Draft, submitted, screening, accepted or rejected'], ['Physical cargo', 'Not arrived, received, staged or quarantined, loaded or handed over'], ['Exception', 'Open, evidence pending, under review, resolved'], ['Release', 'The six states above']].map(r => `<tr><td><b>${r[0]}</b></td><td>${r[1]}</td></tr>`).join('')}</tbody></table><p class="note">Physical custody is not authorisation to ship: B07 is received and quarantined, and never released.</p></div>
      <div class="card"><div class="card-h"><h2>Rules the workflow never breaks</h2></div><ul style="margin:0;padding-left:18px;font-size:13px"><li>No exception closes without a recorded resolution.</li><li>A documentation approval never stands in for a technical one.</li><li>A changed measurement can reopen approvals that depended on it.</li><li>An approved load list is never edited silently; a new version is drafted.</li><li>The Operations Executive cannot approve in place of a specialist.</li></ul></div></div></div>`;
  else if (tab === 'arch') body = `<div class="stack">${archStack()}<div class="card"><div class="card-h"><h2>Controls by gate</h2></div><div class="tw"><table class="t"><thead><tr><th>Gate</th><th>Technology</th><th>Hard control (rule engine)</th><th>AI-assisted detection</th><th>Risks</th></tr></thead><tbody>${gates.map(g => `<tr><td><b>${g[0]}</b></td><td>${g[1]}</td><td>${g[2]}</td><td>${g[3]}</td><td>${g[4].split(' ').join(', ')}</td></tr>`).join('')}</tbody></table></div>
      <p class="note">Two limits. No temperature monitoring: frozen cargo is outside the dry service, so the right control for R04 is a block at E1, not a sensor in a dry warehouse. And a dimensioning station only measures what fits its range.</p></div>
    <div class="card"><div class="card-h"><h2>Integrations in this prototype</h2></div><table class="t"><thead><tr><th>Connection</th><th>Standard or approach</th><th>Status</th></tr></thead><tbody>${[['Yang Ming carrier adapter', 'DCSA booking, schedules, track and trace, VGM; EDI where no API exists', 'Mock mode'], ['Dock appointment and haulier ETA', 'GPS over MQTT into an ETA service', 'Simulated replay'], ['Handheld scanning', 'GS1 SSCC and EPCIS 2.0 events', 'Internal IDs only'], ['Document extraction', 'OCR with human review', 'Not in this prototype']].map(r => `<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${chip('grey', r[2], 'info')}</td></tr>`).join('')}</tbody></table><p class="note">A published standard does not mean the carrier exposes a conforming API. No simulated response is shown as a live carrier confirmation.</p></div></div>`;
  else body = `<div class="card"><div class="tw"><table class="t"><thead><tr><th>Phase</th><th style="width:22%">Months 0 to 12</th><th>Scope</th><th>Investment</th><th>Go or no-go criteria</th></tr></thead><tbody>${phases.map((p, i) => `<tr><td><span class="bk">${p[0]}</span> <b>${p[1]}</b></td><td><div style="position:relative;height:16px;background:var(--wash);border-radius:4px" data-tip="Month ${p[2]} to ${p[3]}"><div style="position:absolute;left:${p[2] / 12 * 100}%;width:${(p[3] - p[2]) / 12 * 100}%;top:0;bottom:0;border-radius:4px;background:${i === 0 ? '#ED640F' : '#A5350B'}"></div></div><div class="sub num">Month ${p[2]} to ${p[3]}</div></td><td>${p[4]}</td><td>${p[5]}</td><td>${p[6]}</td></tr>`).join('')}</tbody></table></div>
      <p class="note">The order follows the root-cause analysis: E1 is controlled first, with the free checklist in phase 0, because nine of 14 risk types escape there. Each phase is funded only when the one before meets its go/no-go KPI (report Table 17); total CAPEX $74,600.</p></div>`;
  return head('Process blueprint', 'How the control works end to end: what the shipper sees, what happens behind the line, how a booking earns its release, and which layer is allowed to decide.') + tabs('bp', [['svc', 'Service blueprint'], ['life', 'Release lifecycle'], ['arch', 'Control architecture'], ['road', 'Roadmap']]) + body;
};

/* ---- audit trail ---- */
VIEWS.audit = () => {
  const fb = S.ui.tab.aub || '', fs = S.ui.tab.aus || '', rows = visibleAudit().filter(a => (!fb || a.b === fb) && (!fs || a.src === fs));
  return head('Audit trail', 'Who changed what, when, why and on which evidence. Entries are appended, never edited; a correction is a new entry.', `<select data-c="tabSel" data-g="aub" style="width:150px" aria-label="Filter by booking"><option value="">All bookings</option>${B.map(b => `<option ${fb === b.id ? 'selected' : ''}>${b.id}</option>`).join('')}</select><select data-c="tabSel" data-g="aus" style="width:170px" aria-label="Filter by source"><option value="">All sources</option>${Object.entries(SRC).filter(e => e[0] !== 'assume').map(e => `<option value="${e[0]}" ${fs === e[0] ? 'selected' : ''}>${e[1][0]}</option>`).join('')}</select>`) + `
  <div class="card"><div class="tw"><table class="t"><thead><tr><th>Time, ICT</th><th>Actor</th><th>Module</th><th>Booking</th><th>Event</th><th>Previous state</th><th>New state</th><th>Source</th></tr></thead><tbody>
  ${rows.map(a => `<tr><td class="num">${fmt(a.t)}</td><td>${esc(a.who)}</td><td>${a.mod}</td><td>${a.b ? link('/bookings/' + a.b, `<b>${a.b}</b>`) : ''}</td><td>${esc(a.ev)}</td><td class="sub">${esc(a.from)}</td><td>${esc(a.to)}</td><td>${src(a.src)}</td></tr>`).join('') || '<tr><td colspan="8" class="sub">No entries match.</td></tr>'}</tbody></table></div>
  <p class="note">${rows.length} entries up to ${fmt(now())}. Events later than the simulation clock, such as the arrival of B02 on 04 Jul, are not shown as facts yet.</p></div>`;
};
A.tabSel = d => { S.ui.tab[d.g] = d.v; };

seed();
if (!location.hash) history.replaceState(null, '', '#/dashboard');
render();
</script>
</body>
